app-id: org.v1993.NXDumpClient
runtime: org.gnome.Platform
# Remember to update CI image as well
runtime-version: "50"
sdk: org.gnome.Sdk
command: nxdumpclient
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Switch USB access
  - --device=all
  # Required for hotplug
  - --share=network
  # Default dump destination
  - --filesystem=xdg-download

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/girepository-1.0
  - /share/gir-1.0
  - /share/vala

modules:
  - name: libgusb
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dtests=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/hughsie/libgusb/releases/download/0.4.9/libgusb-0.4.9.tar.xz
        sha256: 9df5ef301d6a4b361002aa52cce1165a87a89744055879bdbab31e7e86f1e846
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hughsie/libgusb/releases/latest
          version-query: .tag_name
          url-query:
            .assets[] | select(.name=="libgusb-" + $version + ".tar.xz")
            | .browser_download_url

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dbackend-gtk4=enabled
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/flatpak/libportal/releases/download/0.9.1/libportal-0.9.1.tar.xz
        sha256: de801ee349ed3c255a9af3c01b1a401fab5b3fc1c35eb2fd7dfb35d4b8194d7f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/flatpak/libportal/releases/latest
          version-query: .tag_name
          url-query:
            .assets[] | select(.name=="libportal-" + $version + ".tar.xz")
            | .browser_download_url

  - name: nxdumpclient
    buildsystem: meson
    builddir: true
    config-opts:
      - -Dudev_rules=prompt
      - -Dlibportal=enabled
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/
          - .git/
